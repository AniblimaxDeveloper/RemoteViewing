name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;36.0.0"

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 9.6

      - name: Build Controller
        working-directory: android-controller
        run: |
          chmod +x ../gradlew
          ../gradlew assembleDebug

      - name: Build Target
        working-directory: android-target
        run: |
          chmod +x ../gradlew
          ../gradlew assembleDebug

      - name: Upload Controller APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteViewing-Controller
          path: android-controller/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Target APK
        uses: actions/upload-artifact@v4
        with:
          name: RemoteViewing-Target
          path: android-target/app/build/outputs/apk/debug/app-debug.apk
